# Automatische Veröffentlichung auf GitHub Pages.
#
# Bei jedem Push auf den Zweig „main“ passiert Folgendes auf einem Rechner von GitHub:
#   1. Code holen, Node.js einrichten, Bausteine installieren
#   2. Tests laufen lassen – schlägt einer fehl, wird NICHT veröffentlicht:
#      erst die Logik-Tests (Vitest), dann die Ende-zu-Ende-Tests im Browser (Playwright,
#      Chromium und WebKit, siehe playwright.config.ts)
#   3. Fertige Version bauen (Ordner dist) und auf GitHub Pages stellen
name: Veröffentlichen

on:
  push:
    branches: [main]
  # erlaubt, die Veröffentlichung auf der GitHub-Seite von Hand zu starten
  workflow_dispatch:

# Rechte, die GitHub Pages zum Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird zu Ende geführt
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # Browser für die Ende-zu-Ende-Tests samt den Systembausteinen, die WebKit braucht
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Schlägt ein Ende-zu-Ende-Test fehl: Aufzeichnungen zum Herunterladen ablegen
      # (auf der GitHub-Seite des Laufs unter „Artifacts“; ansehen mit `npx playwright show-trace`)
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ergebnisse
          path: test-results/
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
